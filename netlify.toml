# Netlify: static frontend + same-origin proxy to the Render API.
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# TODO: replace RENDER_SERVICE_URL with the host of the Render service (e.g. myograph-api.onrender.com), no scheme.
[[redirects]]
  from = "/api/*"
  to = "https://RENDER_SERVICE_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
