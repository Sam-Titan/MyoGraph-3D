# 3D anatomy map — the ONE place that links model targets to geometry.
# Source meshes: BodyParts3D 4.0 (DBCLS), Wavefront OBJ. Free, no account needed.
#   Download isa_BP3D_4.0_obj_99.zip (~143 MB) and isa_parts_list_e.txt from
#   https://dbarchive.biosciencedbc.jp/en/bodyparts3d/download.html
#   and place them at data/raw/bp3d/ (gitignored; the script reads the zip in place, still zipped).
#   Only the built frontend/public/models/heart.glb is committed.
# File naming (4.0): the zip holds FJ<n>.obj files, NOT FMA-named ones. The link is
#     isa_parts_list_e.txt:  FMA concept id -> BP representation id
#     each .obj header:      "# File ID : FJ<n>" / "# Representation ID : BP<m>"
#   so the build script indexes the zip by reading each member's header and joins on the BP id.
#   One BP id may resolve to several FJ files (all are merged; each FJ file is merged once per node,
#   and may belong to only ONE node — the script fails if two nodes claim the same file).
# License: the BodyParts3D site states CC BY 4.0; the OBJ headers still embed CC BY-SA 2.1 Japan.
#   heart.glb is a derivative of BodyParts3D and is released under CC BY-SA 4.0, which satisfies both.
#   Repo code remains MIT. See frontend/public/models/LICENSE-ASSETS.md. Credit text (use verbatim):
#   "BodyParts3D, © The Database Center for Life Science licensed under CC Attribution 4.0 International"
#
# `fma` entries:
#   - a plain ID            -> include it if it resolves to at least one .obj
#   - a list of IDs [A, B]  -> ALTERNATIVES: use the first one that resolves to a file, ignore the rest
# Some FMA IDs are COMPOSITES (no .obj of their own; their children carry the geometry). The build script
# must log found/missing per node and FAIL LOUDLY if a target vessel ends up with zero geometry (then use
# the procedural-tube fallback below).
# Each built node also carries glTF extras `anchor` [x,y,z]: a vertex on its surface for <Html> labels.
# Rule: the vertex maximising dot(v - heart_centroid, side_dir), side_dir from the node's `expect_side`
# (anterior +Z, posterior -Z, left +X, right -X); among near-ties (5 % of the extent) prefer vertices that
# face the default camera and are not occluded by the heart. `anchorHidden` is set when none is visible
# (e.g. LCX sits behind the heart from the front); the label is then drawn dashed. Nodes without
# `expect_side` use the direction from the heart centroid to their own centroid. Deterministic.
# Selecting a node rotates the camera to its `viewDir` extra (target -> camera) and fits its bounding box.
# Optional per-node `view_dir: [x, y, z]` sets it; otherwise it derives from `expect_side` as an
# azimuth from the anterior axis at the default elevation: anterior 0 deg, right -45 deg (front-right),
# left +110 deg (left-lateral, slightly posterior), posterior 180 deg. Nodes with neither keep the
# default anterior view. The frontend never names a vessel: it reads the extra.
# The API exposes `nodes[].name` + `target` (via GET /api/features -> targets[].node), so the frontend
# never hard-codes vessel names. A pytest checks every target in features.yaml has exactly one node here.
#
# v2 additions (all optional knobs live here, the build script and the schema in backend/ml/anatomy.py read them):
#   inflate     per node, source MILLIMETRES. Vertices move along smoothed normals (duplicate vertices are merged
#               first so seams do not open). Capped per vertex at inflate_edge_ratio x its mean edge length; the
#               build reports requested vs applied and warns when the cap removes more than half.
#   role        vessel (model target, coloured by prediction) | muscle (the heart body) | context.
#   territory   true on role: vessel nodes. Each gets one channel of the heart's `_TERRITORY` vertex attribute:
#               weight 0-1 from the distance of the heart vertex to that artery (independent channels, not
#               normalised across vessels), computed on the final vertices of each LOD. Channel order = node order
#               here; the heart node's extras list it in `territoryChannels`. An APPROXIMATE, nearest-artery
#               illustration of the region each artery supplies, never a clinical map.
#   territory_falloff_mm / territory_max_mm   optional per-node override of the global `territory` values below. BodyParts3D has no
#               branches of the circumflex beyond its trunk (FMA3895; the left marginal vein is a vein), so the short LCX
#               gets a wider reach instead, to show its region at a strength comparable to LAD and RCA.
#   where       plain-language location, shown in the vessel key.
#   max_triangles_mobile   per-node budget of the second GLB (output_mobile); same node names and extras.


output: frontend/public/models/heart.glb
output_mobile: frontend/public/models/heart.mobile.glb
units: "BodyParts3D is in millimetres in a whole-body frame -> recentre on heart centroid, scale to ~2 scene units tall, convert to Y-up"

territory:
  falloff_mm: 12      # Gaussian scale of the weight with distance from the artery
  max_mm: 30          # weight is exactly 0 beyond this distance

# Hard limits the build enforces on each file (strict < for triangles, <= for bytes).
budget_desktop: {max_triangles: 80000, max_bytes: 2000000}
budget_mobile: {max_triangles: 40000, max_bytes: 1000000}

inflate_edge_ratio: 2.0

nodes:
  # --- target vessels: node names MUST equal target ids (LAD/LCX/RCA). Colour is driven by predictions. ---
  - name: LAD
    target: LAD
    role: vessel
    territory: true
    where: front of the heart, in the groove between the two lower chambers
    # FMA3862 (anterior interventricular branch) is absent in 4.0; its trunk is FMA74912. Then diagonal,
    # conus, right anterior (first/second/third) and septal branches. FMA3870/13914/13921 are composites.
    fma: [FMA74912, FMA3860, FMA3868, FMA3872, FMA3874, FMA3876, FMA3892]
    expect_side: anterior                     # build-time sanity check vs heart centroid (anterior|posterior|left|right)
    inflate: 0.8
    max_triangles: 8000
    max_triangles_mobile: 4000
  - name: LCX
    target: LCX
    role: vessel
    territory: true
    where: left side and back of the heart, wrapping around the left lower chamber
    territory_falloff_mm: 22
    territory_max_mm: 45
    fma: [FMA3895]                            # circumflex branch of left coronary artery
    expect_side: left
    inflate: 0.8
    max_triangles: 8000
    max_triangles_mobile: 4000
  - name: RCA
    target: RCA
    role: vessel
    territory: true
    where: right side of the heart, running along the lower right edge
    # trunk, marginal, posterior interventricular, first anterior / first posterior ventricular branches
    # (FMA3813/FMA3835 are composites of those first branches)
    fma: [FMA3802, FMA3818, FMA3840, FMA3815, FMA3837]
    expect_side: right                        # patient's right
    inflate: 0.8
    max_triangles: 10000
    max_triangles_mobile: 5000

  # --- context anatomy: neutral colours, not prediction-driven ---
  - name: LM
    fma: [FMA3855]                            # trunk of left coronary artery (left main stem)
    inflate: 0.8
    max_triangles: 2000
    max_triangles_mobile: 1000
  - name: heart
    target: CAD                               # clicking the heart body selects overall CAD
    role: muscle
    # 4.0 has no whole-heart / wall-of-heart mesh: wall of ventricle + walls of right and left atrium
    # (FMA13883 "wall of atrium" is a composite of the two atrial walls).
    fma: [FMA13884, FMA9457, FMA9531]
    max_triangles: 40000
    max_triangles_mobile: 20000
  - name: aorta
    fma: [FMA3736]                            # ascending aorta
    max_triangles: 6000
    max_triangles_mobile: 3000
    optional: true
  - name: veins
    fma: [FMA4706, FMA4707, FMA4713, FMA4714] # coronary sinus + great / middle / small cardiac veins
    max_triangles: 6000
    max_triangles_mobile: 3000
    optional: true
    default_visible: false

fallback:
  # If a target vessel has no usable geometry, render it as a TubeGeometry along a CatmullRomCurve3
  # through points in frontend/src/features/heart3d/vessels.fallback.json (captured with the dev point picker).
  tube_radius: 0.035
