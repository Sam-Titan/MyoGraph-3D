# Plain-language wording shown in the UI. Validated by backend/ml/display.py and served by GET /api/display, so the
# frontend never hard-codes these sentences. Numbers are never typed here: {placeholders} are filled from the API
# (/api/predict, /api/intervals) or metrics.json. Wording rules: say "probability" / "model estimate", never
# "diagnosis"; no advice; these are estimates from patients who were already referred for angiography.

# The main label for every target compares the POINT estimate with that target's own cut-off (threshold).
# "uncertain" is appended when the range crosses that cut-off.
threshold_labels:
  above: "Above the model's cut-off"
  below: "Below the model's cut-off"
  uncertain_suffix: "uncertain"

# Number of factors shown as their own waterfall step; the rest become one "N other factors" step.
waterfall_top_n: 6

# Placeholders: {p} estimate, {outcome} the target's outcome phrase, {range} e.g. 65–87%, {thr} the target's cut-off.
headline: "The model estimates a {p} probability of {outcome}{range}."
headline_range: " (range {range})"
cutoff_line: "The model's cut-off for this estimate is {thr}."
cutoff_crosses: "The range crosses the cut-off."

# {n_total} patients in the dataset, {prev} the dataset share (in 100 patients) that had THIS target's outcome.
base_rate_note:
  line1: "These are estimates from a model trained on {n_total} patients who had already been referred for an angiogram, and {prev} in 100 of them had {outcome}."
  line2: "People who haven't been referred for an angiogram usually have a much lower chance, so these numbers are not your personal risk."

range_meaning: "The range shows how much the estimate depends on which patients the model learned from. It is not a guarantee, and it is not the range of anyone's true risk."

waterfall:
  title: "How the model got to {p}"
  start_label: "Model baseline"
  end_label: "Model estimate"
  baseline_caption: "Where the model starts for an average patient in its training data. This is the model's baseline for {target} ({base}), not the {prev} of dataset patients who had {outcome}; the two are close but not the same."
  order_caption: "Each step adds to the one before it and is shown in percentage points. Step sizes depend on the order of the steps, so read them as a rough guide, not exact amounts."
  points: "{sign}{n} points"
  cutoff_tick: "cut-off {thr}"
  technical_title: "Technical details"
  technical_line: "Log-odds contributions (SHAP) behind the steps above. Baseline log-odds {base_logit}; the contributions add up exactly to the calibrated log-odds {logit}, which is {p}."

dots:
  caption: "If 100 patients had records like this one, the model expects about {p} of them to have {outcome}. Lighter dots show the range."
  legend_solid: "Inside the whole range"
  legend_light: "Range"
  legend_ring: "Estimate"

performance:
  roc_auc: "Shown one patient who has {outcome} and one who doesn't, the model gives the higher estimate to the right one about {cv} times out of 100 (cross-validated on the training patients; {holdout} out of 100 on the hold-out patients)."
  metric_example: "Example for {target}, hold-out set of {n_test} patients:"
  brier: "Brier {value}: the average squared gap between the estimate and what happened, from 0 (perfect) to 1. Lower is better; always giving the average share of {prev} would score about {ref}."
  accuracy: "Accuracy {value}: {v100} of 100 patients were labelled correctly. Always picking the commoner group would already get {majority} of 100."
  precision: "Precision {value}: of 100 patients the model put above its cut-off, about {v100} really had {outcome}."
  recall: "Recall {value}: of 100 patients who really had {outcome}, the model put about {v100} above its cut-off."
  f1: "F1 {value}: one number that balances precision and recall; 1 is perfect."

# Reliability tiers use the cross-validated ROC-AUC of each target.
trust:
  title: "How much to trust each estimate"
  reliable_min_auc: 0.80
  rule: "“Fairly reliable” means a cross-validated ROC-AUC of at least {min_auc}. This is a rule of thumb, not a clinical standard."
  reliable: "{id} ({label}): fairly reliable. Cross-validated ROC-AUC {auc}. The range crosses the cut-off for {n_unc} of {n} hold-out patients."
  weak: "{id} ({label}): weak. Cross-validated ROC-AUC {auc}. The range crosses the cut-off for {n_unc} of {n} hold-out patients, so this estimate is much less certain."
  footer: "All of this comes from {n_total} patients who were already referred for an angiogram, so even the fairly reliable estimates are only estimates."

# `match` strings are looked up (whole words, case-insensitive) in UI text and get a tap/hover explanation.
glossary:
  - { id: stenosis, match: ["stenosis", "stenotic", "narrowing"], text: "A narrowing of an artery, which can reduce blood flow." }
  - { id: lad, match: ["LAD"], text: "Left anterior descending artery: runs down the front of the heart." }
  - { id: lcx, match: ["LCX"], text: "Left circumflex artery: wraps around the left side of the heart." }
  - { id: rca, match: ["RCA"], text: "Right coronary artery: runs along the right side and underside of the heart." }
  - { id: angiography, match: ["angiography", "angiogram"], text: "An X-ray test that shows the inside of the heart's arteries. Everyone in this dataset was referred for one." }
  - { id: ef, match: ["ejection fraction", "EF-TTE"], text: "The share of blood the heart pumps out with each beat, measured by an ultrasound scan of the heart (echocardiography)." }
  - { id: rwma, match: ["RWMA"], text: "Regional wall motion abnormality: part of the heart wall moves less than it should on the ultrasound scan." }
  - { id: esr, match: ["ESR"], text: "Erythrocyte sedimentation rate: a blood test that rises with inflammation." }
  - { id: roc_auc, match: ["ROC-AUC"], text: "How well the model ranks patients: 0.5 is a coin flip and 1 is perfect." }
  - { id: calibration, match: ["calibration", "calibrated"], text: "Whether estimates match reality: of patients given about 70%, roughly 70 in 100 should have the outcome." }
  - { id: threshold, match: ["cut-off", "threshold"], text: "The cut-off the model uses to call an estimate above or below. It was chosen on the training patients and is not a medical limit." }
  - { id: logodds, match: ["log-odds"], text: "A way of writing a probability that lets contributions be added up. Positive raises the estimate, negative lowers it." }
  - { id: shap, match: ["SHAP"], text: "A method that splits an estimate into how much each input pushed it up or down." }
  - { id: range, match: ["range"], text: "How much the estimate would move if the model had learned from a slightly different set of patients. Not a guarantee." }
