# Feature schema — single source of truth for preprocessing, the API, and the patient form.
# Verified against data/raw/z_alizadeh_sani_ext.csv (303 rows, 59 cols, no missing values).
# The CSV is a lossless one-time export of sheet "Sheet 1 - Table 1" of the UCI .xlsx (round-trip checked);
# the xlsx's second sheet was an empty header-only template and is not carried over.
#
# Kinds:
#   number    -> numeric input
#   binary    -> yes/no. `source` lists the raw values that mean yes (dataset mixes Y/N and 1/0)
#   category  -> single choice. `encoding` = how model columns are produced
#   derived   -> computed by the backend from other inputs, never sent by the client
#   composite -> one UI/API input that expands into several dataset columns (prevents impossible combos)
#
# `reference` = typical adult reference range, used ONLY for the physiological breakdown display
#   (status low/normal/high). Not used by the model. Labelled in UI as "typical adult reference range".
# `observed` (min/max/median/mode) is computed at train time into artifacts/feature_stats.json —
#   used for defaults and the "outside training range" warning. Do not hard-code it here.

# Every target has a `role`:
#   overall -> the patient-level label (exactly one); drawn as the CAD card, not on a vessel
#   vessel  -> a per-artery stenosis label (at least one); the split stratifies on how many of these are positive
# Code and UI read the role instead of hard-coding target ids.
targets:
  CAD: { column: Cath, positive: CAD,      label: "Overall CAD",   role: overall }
  LAD: { column: LAD,  positive: Stenotic, label: "LAD stenosis",  role: vessel }
  LCX: { column: LCX,  positive: Stenotic, label: "LCX stenosis",  role: vessel }
  RCA: { column: RCA,  positive: Stenotic, label: "RCA stenosis",  role: vessel }

# Leakage guard: these columns must NEVER appear in model inputs for ANY target. Enforced by a test.
excluded_from_inputs: [Cath, LAD, LCX, RCA]

dropped:
  - { column: "Exertional CP", reason: "constant (all 'N') — zero information" }

groups:
  - { id: demographics, label: "Demographics" }
  - { id: history,      label: "Risk factors & history" }
  - { id: exam,         label: "Symptoms & examination" }
  - { id: ecg,          label: "ECG" }
  - { id: labs,         label: "Laboratory" }
  - { id: echo,         label: "Echocardiography" }

features:
  # ---------------- Demographics ----------------
  - { id: age,    column: Age,    label: "Age",    group: demographics, kind: number, unit: "years", input: { min: 18, max: 100, step: 1 } }
  - id: sex
    column: Sex
    label: "Sex"
    group: demographics
    kind: category
    options: [ { value: male, label: "Male", source: Male }, { value: female, label: "Female", source: Fmale } ]  # dataset typo "Fmale"
    encoding: { type: binary, positive: male, model_column: sex_male }
  - { id: weight, column: Weight, label: "Weight", group: demographics, kind: number, unit: "kg", input: { min: 30, max: 200, step: 1 } }
  - { id: height, column: Length, label: "Height", group: demographics, kind: number, unit: "cm", input: { min: 120, max: 220, step: 1 } }  # dataset calls it "Length"
  - id: bmi
    column: BMI
    label: "BMI"
    group: demographics
    kind: derived
    unit: "kg/m²"
    formula: "weight / (height/100)^2"   # verified: matches dataset exactly (max diff 0.0)
    reference: { low: 18.5, high: 24.9 }
  - id: obesity
    column: Obesity
    label: "Obesity"
    group: demographics
    kind: derived
    formula: "bmi > 25"                  # verified: matches 302/303 rows
    source: [Y]
    # DECISION: derived fields are RECOMPUTED from weight/height for training too (overwrites the 1 inconsistent
    # row), so training and serving share one code path and the raw-row <-> API round-trip test holds exactly.

  # ---------------- Risk factors & history ----------------
  - { id: dm,  column: DM,  label: "Diabetes mellitus", group: history, kind: binary, source: [1] }
  - { id: htn, column: HTN, label: "Hypertension",      group: history, kind: binary, source: [1] }
  - id: smoking
    label: "Smoking status"
    group: history
    kind: composite
    options:
      - { value: never,   label: "Never",   sets: { "Current Smoker": 0, "EX-Smoker": 0 } }
      - { value: current, label: "Current", sets: { "Current Smoker": 1, "EX-Smoker": 0 } }
      - { value: ex,      label: "Former",  sets: { "Current Smoker": 0, "EX-Smoker": 1 } }
    # verified: no row has both = 1
  - { id: fh,  column: FH,  label: "Family history of CAD", group: history, kind: binary, source: [1] }
  - { id: dlp, column: DLP, label: "Dyslipidemia",          group: history, kind: binary, source: [Y] }
  - { id: crf, column: CRF, label: "Chronic renal failure",  group: history, kind: binary, source: [Y] }
  - { id: cva, column: CVA, label: "Prior stroke (CVA)",     group: history, kind: binary, source: [Y] }
  - { id: airway_disease,  column: "Airway disease",  label: "Airway disease",          group: history, kind: binary, source: [Y] }
  - { id: thyroid_disease, column: "Thyroid Disease", label: "Thyroid disease",         group: history, kind: binary, source: [Y] }
  - { id: chf, column: CHF, label: "Congestive heart failure", group: history, kind: binary, source: [Y] }

  # ---------------- Symptoms & examination ----------------
  - { id: bp, column: BP, label: "Systolic blood pressure", group: exam, kind: number, unit: "mmHg", input: { min: 70,  max: 250, step: 1 }, reference: { low: 90, high: 129 } }
  - { id: pr, column: PR, label: "Pulse rate",              group: exam, kind: number, unit: "bpm",  input: { min: 30,  max: 180, step: 1 }, reference: { low: 60, high: 100 } }
  - id: chest_pain
    label: "Chest pain type"
    group: exam
    kind: composite
    options:
      - { value: typical,    label: "Typical angina",  sets: { "Typical Chest Pain": 1, Atypical: N, Nonanginal: N } }
      - { value: atypical,   label: "Atypical",        sets: { "Typical Chest Pain": 0, Atypical: Y, Nonanginal: N } }
      - { value: nonanginal, label: "Non-anginal",     sets: { "Typical Chest Pain": 0, Atypical: N, Nonanginal: Y } }
      - { value: none,       label: "None",            sets: { "Typical Chest Pain": 0, Atypical: N, Nonanginal: N } }
    # verified: the 3 columns are mutually exclusive in all 303 rows
  - { id: lowth_ang, column: "LowTH Ang", label: "Low-threshold angina", group: exam, kind: binary, source: [Y] }
  - { id: dyspnea,   column: Dyspnea,     label: "Dyspnea",              group: exam, kind: binary, source: [Y] }
  - { id: function_class, column: "Function Class", label: "Functional class", group: exam, kind: number, unit: "0–3", input: { min: 0, max: 3, step: 1 } }
  - { id: edema,                 column: Edema,                   label: "Edema",                 group: exam, kind: binary, source: [1] }
  - { id: weak_peripheral_pulse, column: "Weak Peripheral Pulse", label: "Weak peripheral pulse", group: exam, kind: binary, source: [Y] }
  - { id: lung_rales,            column: "Lung rales",            label: "Lung rales",            group: exam, kind: binary, source: [Y] }
  - { id: systolic_murmur,       column: "Systolic Murmur",       label: "Systolic murmur",       group: exam, kind: binary, source: [Y] }
  - { id: diastolic_murmur,      column: "Diastolic Murmur",      label: "Diastolic murmur",      group: exam, kind: binary, source: [Y] }

  # ---------------- ECG ----------------
  - { id: q_wave,        column: "Q Wave",        label: "Q wave",        group: ecg, kind: binary, source: [1] }
  - { id: st_elevation,  column: "St Elevation",  label: "ST elevation",  group: ecg, kind: binary, source: [1] }
  - { id: st_depression, column: "St Depression", label: "ST depression", group: ecg, kind: binary, source: [1] }
  - { id: t_inversion,   column: Tinversion,      label: "T inversion",   group: ecg, kind: binary, source: [1] }
  - { id: lvh,           column: LVH,             label: "LV hypertrophy",group: ecg, kind: binary, source: [Y] }
  - { id: poor_r_progression, column: "Poor R Progression", label: "Poor R-wave progression", group: ecg, kind: binary, source: [Y] }
  - id: bbb
    column: BBB
    label: "Bundle branch block"
    group: ecg
    kind: category
    options: [ { value: none, label: "None", source: N }, { value: lbbb, label: "Left (LBBB)", source: LBBB }, { value: rbbb, label: "Right (RBBB)", source: RBBB } ]
    encoding: { type: one_hot, drop: none, model_columns: [bbb_lbbb, bbb_rbbb] }

  # ---------------- Laboratory ----------------
  - { id: fbs,   column: FBS,   label: "Fasting blood sugar", group: labs, kind: number, unit: "mg/dL",   input: { min: 40,   max: 600,   step: 1 },    reference: { low: 70,   high: 99 } }
  - { id: cr,    column: CR,    label: "Creatinine",          group: labs, kind: number, unit: "mg/dL",   input: { min: 0.2,  max: 10,    step: 0.1 },  reference: { low: 0.6,  high: 1.3 } }
  - { id: tg,    column: TG,    label: "Triglycerides",       group: labs, kind: number, unit: "mg/dL",   input: { min: 20,   max: 1500,  step: 1 },    reference: { low: 0,    high: 149 } }
  - { id: ldl,   column: LDL,   label: "LDL cholesterol",     group: labs, kind: number, unit: "mg/dL",   input: { min: 10,   max: 400,   step: 1 },    reference: { low: 0,    high: 129 } }
  - { id: hdl,   column: HDL,   label: "HDL cholesterol",     group: labs, kind: number, unit: "mg/dL",   input: { min: 5,    max: 150,   step: 0.1 },  reference: { low: 40,   high: 150 } }
  - { id: bun,   column: BUN,   label: "Blood urea nitrogen", group: labs, kind: number, unit: "mg/dL",   input: { min: 2,    max: 150,   step: 1 },    reference: { low: 7,    high: 20 } }
  - { id: esr,   column: ESR,   label: "ESR",                 group: labs, kind: number, unit: "mm/h",    input: { min: 0,    max: 150,   step: 1 },    reference: { low: 0,    high: 20 } }
  - { id: hb,    column: HB,    label: "Hemoglobin",          group: labs, kind: number, unit: "g/dL",    input: { min: 4,    max: 22,    step: 0.1 },  reference: { low: 12,   high: 17.5 } }
  - { id: k,     column: K,     label: "Potassium",           group: labs, kind: number, unit: "mEq/L",   input: { min: 2,    max: 8,     step: 0.1 },  reference: { low: 3.5,  high: 5.0 } }
  - { id: na,    column: Na,    label: "Sodium",              group: labs, kind: number, unit: "mEq/L",   input: { min: 110,  max: 170,   step: 1 },    reference: { low: 135,  high: 145 } }
  - { id: wbc,   column: WBC,   label: "White blood cells",   group: labs, kind: number, unit: "/mm³",    input: { min: 1000, max: 40000, step: 100 },  reference: { low: 4000, high: 11000 } }
  - { id: lymph, column: Lymph, label: "Lymphocytes",         group: labs, kind: number, unit: "%",       input: { min: 1,    max: 90,    step: 1 },    reference: { low: 20,   high: 40 } }
  - { id: neut,  column: Neut,  label: "Neutrophils",         group: labs, kind: number, unit: "%",       input: { min: 10,   max: 99,    step: 1 },    reference: { low: 40,   high: 70 } }
  - { id: plt,   column: PLT,   label: "Platelets",           group: labs, kind: number, unit: "×10³/mm³",input: { min: 10,   max: 1000,  step: 1 },    reference: { low: 150,  high: 450 } }

  # ---------------- Echocardiography ----------------
  - { id: ef_tte,      column: "EF-TTE",      label: "Ejection fraction (TTE)",          group: echo, kind: number, unit: "%",          input: { min: 5, max: 80, step: 1 }, reference: { low: 50, high: 75 } }
  - { id: region_rwma, column: "Region RWMA", label: "Regions with wall-motion abnormality", group: echo, kind: number, unit: "regions (0–4)", input: { min: 0, max: 4, step: 1 }, reference: { low: 0, high: 0 } }
  - id: vhd
    column: VHD
    label: "Valvular heart disease"
    group: echo
    kind: category
    options: [ { value: none, label: "None", source: N }, { value: mild, label: "Mild", source: mild }, { value: moderate, label: "Moderate", source: Moderate }, { value: severe, label: "Severe", source: Severe } ]
    encoding: { type: ordinal, order: [none, mild, moderate, severe], model_column: vhd }

# Resulting model matrix: 54 dataset input columns (59 − 4 targets − Exertional CP), BBB expanded to 2 dummies
# => 55 model columns. API inputs: 49 (bmi/obesity derived; smoking and chest_pain are composites).
# SHAP for multi-column inputs (bbb, smoking, chest_pain) is SUMMED back to the input id for display (exact: SHAP is additive).